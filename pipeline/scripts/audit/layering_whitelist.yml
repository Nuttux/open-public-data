# Whitelist for pipeline/scripts/audit/check_layering.py
# ============================================================================
# Toutes les catégories d'exception sont actuellement vides. La règle
# layering n'a pas d'exception live :
#
#   - tout seed entre via stg_*
#   - tout core_* lit stg_* (+ optionnel int_*)
#   - tout int_* lit core_*
#   - tout mart_* lit core_* ou int_*
#   - tout export_*.py lit mart_* uniquement
#   - aucun sync/tools/enrich n'écrit dans website/public/data/
#
# Cf. docs/data-platform/04-layering-convention.md pour les règles
# détaillées et docs/decisions/ pour les ADR figeant les choix.
#
# Si une exception future est nécessaire, l'ajouter ICI avec :
#   - justification: <pourquoi>
#   - todo: <comment éliminer>
#   - linked_adr: <numéro de l'ADR qui la documente>
# ============================================================================

# Whitelist pour scripts d'enrichissement écrivant à public/data/enrichment/
# (cf ADR-0004 : pattern polymorphe via mart_enrichment_caches).
enrich_writes_to_enrichment:
  - script: pipeline/scripts/enrich/fetch_sf_place_photos.py
    justification: "Wikimedia Commons lead photo + licence/credit per SF place → enrichment/us_sf_places/_photo_credits.json. Per-record cache, no metric."
  - script: pipeline/scripts/enrich/fetch_sf_place_photos_wide.py
    justification: "Dev-only wider photo ladder for SF places, same credits file as fetch_sf_place_photos.py. Per-record cache, no metric."
  - script: pipeline/scripts/enrich/fetch_sf_landing_photos.py
    justification: "Wikimedia Commons photos + credits for the SF landing deck → enrichment/us_sf_landing/_photo_credits.json. Per-record cache, no metric."
  - script: pipeline/scripts/enrich/fetch_marseille_place_photos.py
    justification: "Marseille twin of fetch_sf_place_photos.py → enrichment/fr_marseille_places/_photo_credits.json. Per-record cache, no metric."
  - script: pipeline/scripts/enrich/fetch_marseille_place_wiki.py
    justification: "Wikipedia lead extract (FR+EN) per Marseille place → enrichment/fr_marseille_places/_wiki.json. Per-record cache, no metric."
  - script: pipeline/scripts/enrich/link_sf_payees.py
    justification: "Per-payee Internet Archive paper-trails (document lists + glosses) → enrichment/us_sf_payee_documents/payee-<slug>.json. Per-record cache, no metric; lazy-loaded by the payee fiche."

# Whitelist pour bypasses ingest → public/data/ direct
# (toutes éliminées Phases 8-10, voir ADR-0001).
ingest_writes_to_data:
  - script: pipeline/scripts/enrich/build_cross_cutting_themes.py
    justification: "Cross-cutting themes table — agrège plusieurs core_* pour produire un index thématique web-ready. Refactor via mart_cross_cutting pending."
    todo: "Wrap en mart_cross_cutting + retire l'écriture directe vers public/data/"
    linked_adr: ADR-0001
  - script: pipeline/scripts/enrich/build_drilldown.py
    justification: "Drilldown tree builder — joint plusieurs mart_* pour produire la structure macro→micro consommée par Daily Bread. Logique trop spécifique pour un mart simple."
    todo: "Découper en mart_drilldown_etat / mart_drilldown_local / mart_drilldown_secu — déjà partiellement amorcé via build_drilldown_etat/local/secu.py"
    linked_adr: ADR-0001
  # --- SF / Marseille lieux & payees (audit 2026-08-26, chantier layering US/BR) ---
  # Two bridge scripts that patch already-exported files (text only).
  - script: pipeline/scripts/enrich/apply_sf_place_summaries.py
    justification: "Patches grounded summaries + curated document list into already-exported SF place fiches (bridge over export_sf_places.py). Text only, no metric."
    todo: "Feed the summaries to export_sf_places.py as an input (like vulgarization_sf_contracts.json) and delete this bridge"
    linked_adr: ADR-0004
  - script: pipeline/scripts/enrich/apply_sf_contract_vulgarization.py
    justification: "Bridge that patches contract explanations into built exports; export_us_sf_contracts.py already reads the same JSON as input, so a normal export makes it redundant. Text only, no metric."
    todo: "Delete once a full export_us_sf_contracts.py run has been confirmed to carry the explanations"
    linked_adr: ADR-0004
  # Real bypasses — these three produce money or identity tables the UI reads.

# Whitelist pour scripts WIP non câblés à l'UI
# (toutes redirigées vers pipeline/cache/wip/ Phase 12).
wip_not_yet_consumed: []

# Whitelist pour seeds-mappings ref'd hors stg
# (toutes wrappées en stg_* Phase 15, voir ADR-0001).
mapping_seeds_allowed_outside_stg: []

# Whitelist pour seeds-cache LLM ref'd hors stg
# (toutes wrappées en stg_* Phase 15).
llm_cache_seeds_allowed_in_int: []

# Whitelist pour scripts dont l'AST ne peut pas être analysé statiquement
# (indirection trop dynamique : subprocess, importlib, exec, etc.). Une
# review manuelle confirme qu'ils n'écrivent PAS dans public/data/.
# Sans cette whitelist, l'audit lève un warning "E5-suspicious" qui fait
# fail le CI en mode --strict alors qu'aucune violation réelle n'existe.
e5_ast_reviewed_clean:
  - script: pipeline/scripts/tools/parse_il_pdf_text.py
    reason: "PDF text extraction via pdfplumber subprocess — pas d'écriture vers public/data/, vérifié manuellement 2026-05-13"
  - script: pipeline/scripts/tools/parse_subv_pdf_text.py
    reason: "PDF text extraction via pdfplumber subprocess — pas d'écriture vers public/data/, vérifié manuellement 2026-05-13"
  - script: pipeline/scripts/enrich/clean_bmo_snippets.py
    reason: "Re-nettoie les extraits BMO dans pipeline/cache/lieux/*.jsonl (write_text sur ces fichiers) — aucune écriture vers public/data/, vérifié manuellement 2026-08-26"
  - script: pipeline/scripts/tools/parse_subv_pdf_m14.py
    reason: "Parseur des annexes M14 de subventions 2010-2012 : écrit un seul fichier, au chemin passé par --out (même forme que parse_subv_pdf_text.py, lu par sync_pdf_subventions_b811.py) — l'AST ne peut pas suivre un chemin donné à l'appel ; aucune mention de public/data ni de website dans le script, aucun appel depuis le dépôt, vérifié manuellement 2026-09-14"
