version: 2

models:
  - name: mart_sankey_national
    description: "Lignes budget national par nature (source d'export). Grain (insee, année, section, sens, groupe, catégorie). Contrat JSON commun Paris/Marseille."
    columns:
      - name: code_insee
        tests: [not_null]
      - name: montant
        tests: [not_null]

  - name: mart_budget_reconciliation
    description: "Self-check Step-1 : Σ(balances fonctionnement) vs OFGL montant_bp par (insee, année). Écarts relatifs dépense/recette. Adossé au test assert_budget_national_reconciliation."
    columns:
      - name: code_insee
        tests: [not_null]

  - name: mart_benchmarking
    description: "KPIs financiers comparés - 5 villes avec métriques par habitant et rankings"

  - name: mart_evolution_national
    description: "Tendances pluriannuelles budget par ville"

  - name: mart_marches_national
    description: "Marchés publics agrégés par (ville, année, catégorie CPV)"

  - name: mart_subventions_national
    description: "Subventions agrégées par (ville, année)"

  - name: mart_bilan_national
    description: "Patrimoine/bilan KPIs par (ville, année)"

  - name: mart_budget_national_comptes
    description: "Détail des comptes (M57) derrière chaque groupe du budget par nature, libellés en français simple ; ligne « autres » = reste du groupe"
    columns:
      - name: compte
        tests: [not_null]

  - name: mart_chantiers_etat_national
    description: "Projets Fonds vert dont la commune est bénéficiaire (SIREN), une ligne par projet"
  - name: mart_maires_national
    description: "Maire (nom, prénom, depuis) et taille du conseil par commune — RNE, colonnes non sensibles. Depuis quand : maire_depuis_premier, maire_depuis_borne (« au moins » : la chaîne atteint la plus ancienne capture) et mandats (« 2014,2020,2026 »), par chaînage de la même personne à travers les versions archivées du répertoire (stg_rne_maires_historique)."
    tests:
      - dbt_utils.expression_is_true:
          expression: "maire_nom IS NULL OR mandats IS NOT NULL"
      - dbt_utils.expression_is_true:
          expression: "maire_depuis IS NULL OR maire_depuis_premier <= maire_depuis"
    columns:
      - name: code_insee
        tests: [not_null, unique]

  - name: mart_taux_fonciers_national
    description: "Taux de taxe foncière (bâti, non-bâti, part intercommunale) par commune et année, REI DGFiP, avec la médiane de strate"

  - name: mart_communes_fonctions
    description: "À quoi sert l'argent des communes : cellules commune × exercice × référence fonctionnelle × compte, dépenses de fonctionnement (classe 6) du budget principal. Compartiment = clé de fonction, « nv » (non ventilable) ou « rev » (reversements). Source de export_communes_fonctions.py (fonctions.json par commune + manifeste)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [annee, code_insee, fonction_reference, compte]
    columns:
      - name: annee
        tests: [not_null]
      - name: code_insee
        tests: [not_null]
      - name: nomenclature
        tests: [not_null]
      - name: compartiment
        tests:
          - not_null
          - accepted_values:
              values: ['f0_services_generaux', 'f1_securite', 'f2_enseignement', 'f3_culture', 'f4', 'f5', 'f6', 'f7', 'f8', 'f9_action_eco', 'nv', 'rev']
      - name: fonction_reference
        tests: [not_null]
      - name: compte
        tests: [not_null]
      - name: montant
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "!= 0"
      - name: premiere_ligne
        tests: [not_null]
