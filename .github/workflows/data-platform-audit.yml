name: data-platform-audit

# Audit gates pour la data platform. Refuse les PRs qui :
#   - violent le layering stg → core → (int) → mart → export → JSON
#   - écrivent dans website/public/data/ depuis un script ingest/enrich/tools
#   - ont un fetch UI vers /pipeline/cache/wip/ (ou autre chemin interdit)
#   - ne parsent pas en dbt (modèle ou test cassé)
#
# ⚠️  Jobs BQ-dependent (dbt-test, data-quality-audit) sont désactivés par
# défaut et ne tournent QUE si la repository variable `ENABLE_BQ_CI` est
# définie à `true`. Cela nécessite un setup GCP préalable (Workload Identity
# Federation + service account avec permissions BQ) — voir
# docs/runbooks/enable-bq-ci.md.
#
# Tant que ce setup n'est pas fait, le job `ci-status` annonce VISIBLEMENT
# que le mode complet n'est pas actif (pas de fausse impression de couverture).
#
# Retiré le 2026-09-09 : le job `verify-exports` (égalité octet entre un
# export régénéré depuis BigQuery et le JSON committé). Depuis que le refresh
# hebdo publie tout seul (enrich-pipeline.yml), « JSON committé == export
# frais » n'est vrai qu'entre un refresh et la prochaine publication de la
# Ville : le job était rouge à chaque fois que la source bougeait, sans que
# rien ne soit cassé (2026-09-09 : logements 2025 publiés, main pas encore
# rafraîchi). Ce qu'il protégeait — un changement de CODE qui altère un
# chiffre publié — est couvert par le gate de parité pre-push local
# (check_export_parity.sh) et par les gates du refresh (le commit publié est
# celui que le build + Playwright ont testé). Un vert qui dépend du calendrier
# de la Ville n'est pas un test.

# Auto-triggers actifs (réactivés le 2026-07-23 après reset du quota Actions).
# Les jobs non-BQ (layering, dbt parse, schema completeness) tournent sur
# chaque PR/push ; les jobs BQ restent gatés par la variable `ENABLE_BQ_CI`.
on:
  pull_request:
    paths:
      - 'pipeline/**'
      - 'website/src/**'
      - 'website/public/**'
      - 'docs/data-platform/**'
      - '.github/workflows/data-platform-audit.yml'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-status:
    name: ⚠️  CI Status — BQ-dependent jobs may be disabled
    runs-on: ubuntu-latest
    steps:
      - name: Announce coverage
        run: |
          if [[ "${{ vars.ENABLE_BQ_CI }}" == "true" ]]; then
            echo "✅ Full CI : layering + dbt parse + dbt test + source freshness + data-quality-audit"
          else
            echo "⚠️  Partial CI : layering + dbt parse + schema completeness ONLY"
            echo ""
            echo "  The following data-quality jobs are DISABLED:"
            echo "    - dbt test (the 280+ data tests)"
            echo "    - dbt source freshness"
            echo "    - data-quality-audit (réconciliation/complétude/freshness, /methode#audit)"
            echo ""
            echo "  To enable full CI, an admin must:"
            echo "    1. Set up Workload Identity Federation with a GCP service account"
            echo "    2. Add repository secrets: GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT"
            echo "    3. Set repository variable ENABLE_BQ_CI=true"
            echo ""
            echo "  See docs/runbooks/dev-prod-separation.md for the recommended setup."
          fi

  layering-gate:
    name: Layering audit (--strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Run layering audit
        run: python pipeline/scripts/audit/check_layering.py --strict

      - name: Run frontend fetch audit
        run: python pipeline/scripts/audit/check_frontend_fetches.py --strict

      # Hors ligne, sans dépendance : rejoue les cas où une réponse Gallica
      # appariait un fascicule avec la date de son voisin (Bulletin « de 1912 »
      # parlant d'une démolition de 1967). Échoue si l'appariement régresse.
      - name: Auto-test des dates du Bulletin municipal
        run: python pipeline/scripts/sync/sync_gallica_bmo.py --self-test

  publication-coverage:
    # Le crible qui manquait le 2026-09-10 : l'audit qualité tourne DANS
    # l'entrepôt et ne peut pas voir ce qui n'y est jamais entré. Celui-ci part
    # du catalogue de la Ville et de ce que le site sert vraiment — pas besoin
    # de BigQuery, donc il tourne sur chaque PR, même sans ENABLE_BQ_CI.
    #   - série coupée : un morceau de série publié par la Ville qu'on n'ingère pas
    #   - exercices manquants : la Ville publie 2009→2024, le site sert 2019→2024
    #   - écart de total, à filtre égal, sur les séries où le filtre est déclaré
    # Un écart examiné et décidé porte sa raison dans le registre et sort en
    # info, pas en erreur. Le code de sortie 3 veut dire « portail injoignable » :
    # ce n'est pas une erreur de données, on l'affiche en avertissement.
    name: Couverture de publication (Ville × entrepôt × site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Crible de couverture
        run: |
          set +e
          python pipeline/scripts/audit/audit_publication_coverage.py --no-totaux --dry-run
          rc=$?
          set -e
          case "$rc" in
            0) echo "✅ couverture : chaque écart restant porte sa raison" ;;
            3) echo "::warning title=Couverture non vérifiée::le portail opendata.paris.fr n'a pas répondu ou a rendu un catalogue partiel — relancer le job" ;;
            *) echo "::error title=Couverture::une série publiée par la Ville manque au site, ou un morceau de série n'est pas ingéré — voir le rapport ci-dessus"; exit "$rc" ;;
          esac

      - name: Sondage ligne à ligne
        # 20 lignes par série tirées au hasard, chacune recherchée au portail.
        # Une somme juste ne prouve pas qu'une ligne est juste ; ceci le prouve.
        run: |
          set +e
          python pipeline/scripts/audit/audit_echantillon.py --n 20
          rc=$?
          set -e
          case "$rc" in
            0) echo "✅ sondage : toutes les lignes tirées sont identiques à la source" ;;
            3) echo "::warning title=Sondage non concluant::des requêtes au portail ont échoué, aucune ligne fausse trouvée — relancer le job" ;;
            *) echo "::error title=Sondage::une ligne publiée ne correspond pas à sa source"; exit "$rc" ;;
          esac

  dbt-parse:
    name: dbt parse + compile (no BQ access required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          python -m pip install dbt-core dbt-bigquery

      # dbt parse ne nécessite pas de connexion BQ — il valide la syntaxe
      # SQL Jinja, les refs et les schemas YAML.
      - name: dbt parse
        working-directory: pipeline
        run: |
          mkdir -p ~/.dbt
          # profile factice qui n'a pas besoin de creds BQ pour parse
          cat > ~/.dbt/profiles.yml <<EOF
          paris_open_data:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: oauth
                project: dummy
                dataset: dummy
                location: EU
                threads: 1
          EOF
          # Install dbt packages declared in packages.yml (e.g. dbt_utils).
          # Required even for parse — dbt resolves macros from installed packages.
          dbt deps
          dbt parse --no-partial-parse

  schema-yml-completeness:
    name: All dbt models have schema.yml entries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check completeness
        run: |
          python <<'PY'
          import pathlib, re, sys

          schemas = {p: p.read_text() for p in pathlib.Path('pipeline/models').rglob('schema*.yml')}
          missing = []
          for sql in pathlib.Path('pipeline/models').rglob('*.sql'):
              if '/national/' in sql.as_posix():
                  continue  # disabled subproject
              name = sql.stem
              if not any(re.search(rf'^\s*-\s*name:\s*{re.escape(name)}\s*$', t, re.MULTILINE) for t in schemas.values()):
                  missing.append(sql.as_posix())
          if missing:
              print(f'❌ {len(missing)} dbt models missing from schema.yml:')
              for m in missing: print(f'  - {m}')
              sys.exit(1)
          print(f'✅ all {sum(1 for _ in pathlib.Path("pipeline/models").rglob("*.sql") if "/national/" not in _.as_posix())} models documented')
          PY

  # =============================================================================
  # Jobs nécessitant un accès BigQuery (gated par secret)
  # =============================================================================
  # Si le secret GCP_WORKLOAD_IDENTITY_PROVIDER n'est pas défini, ces jobs
  # sont skippés gracieusement. À configurer une fois pour activer la
  # validation data réelle en CI.

  dbt-test:
    name: dbt test (data-quality, full BQ access)
    runs-on: ubuntu-latest
    # Jobs BQ-dependent (coût $ + minutes Actions) : tournent uniquement sur
    # push main, pas sur chaque PR. Pour valider une PR data avant merge,
    # déclencher le workflow manuellement via workflow_dispatch.
    if: ${{ vars.ENABLE_BQ_CI == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    permissions:
      id-token: write   # for Workload Identity Federation
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          python -m pip install dbt-core dbt-bigquery

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: dbt test (data + cross-layer + freshness)
        working-directory: pipeline
        run: |
          mkdir -p ~/.dbt
          # On écrit un profil prod-only et on FORCE --profiles-dir pour
          # éviter que dbt prenne le pipeline/profiles.yml (qui template
          # DBT_USER → 'local' et pointe sur des datasets dev inexistants).
          cat > ~/.dbt/profiles.yml <<EOF
          paris_open_data:
            target: prod
            outputs:
              prod:
                type: bigquery
                method: oauth
                project: open-data-france-484717
                dataset: dbt_paris
                location: EU
                threads: 4
          EOF
          dbt deps --profiles-dir ~/.dbt
          dbt source freshness --profiles-dir ~/.dbt --target prod
          # Marseille : stg_marseille_budget restreint au budget principal et
          # normalisation accent-safe (2026-08-26) — plus d'exclusion nécessaire.
          dbt test --profiles-dir ~/.dbt --target prod

  data-quality-audit:
    name: data quality audit (réconciliation, complétude, freshness)
    runs-on: ubuntu-latest
    # Jobs BQ-dependent (coût $ + minutes Actions) : tournent uniquement sur
    # push main, pas sur chaque PR. Pour valider une PR data avant merge,
    # déclencher le workflow manuellement via workflow_dispatch.
    if: ${{ vars.ENABLE_BQ_CI == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-cloud-bigquery db-dtypes

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # Rejoue l'audit complet (réconciliation core ↔ staging, complétude
      # classification/géoloc, unicité clés, freshness sources/raw/core,
      # business rules Paris Centre/CASVP, anomalies YoY). Le JSON résultat
      # est uploadé en artifact pour comparaison cross-run + diff côté PR.
      - name: Run audit script
        id: audit
        continue-on-error: true
        run: |
          python pipeline/scripts/audit/run_data_quality_audit.py \
            --output /tmp/data_quality_audit_ci.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload audit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-audit-${{ github.sha }}
          path: /tmp/data_quality_audit_ci.json
          retention-days: 90

      - name: Diff vs committed JSON (signaler les régressions)
        run: |
          python3 - <<'PY'
          import json, sys, pathlib
          committed = json.loads(pathlib.Path("website/public/data/data_quality_audit.json").read_text())
          fresh = json.loads(pathlib.Path("/tmp/data_quality_audit_ci.json").read_text())
          c_by_id = {c["id"]: c for c in committed["checks"]}
          regressions = []
          for c in fresh["checks"]:
              prev = c_by_id.get(c["id"])
              if not prev:
                  continue
              # Régression = un check qui était pass ou warn et devient fail
              ladder = {"pass": 0, "warn": 1, "fail": 2}
              if ladder.get(c["status"], 0) > ladder.get(prev["status"], 0):
                  regressions.append(f"  ✗ {c['label']}: {prev['status']} → {c['status']}")
          if regressions:
              print("⚠️ Régressions détectées vs JSON committé :")
              print("\n".join(regressions))
              sys.exit(1)
          print("✓ Aucune régression vs JSON committé")
          PY

      - name: Fail if audit had any fail status
        if: steps.audit.outputs.exit_code != '0'
        run: |
          echo "❌ Audit a remonté au moins un fail — voir le summary plus haut."
          exit 1
