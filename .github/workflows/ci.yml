name: CI

# Gate CI complet pour PRs vers `main` et `test`, et pushes sur ces branches.
#
# Architecture :
#   - build      : lint + typecheck + Vitest + next build (avec artefact .next)
#   - e2e        : Playwright sur build artefact (golden path 6 routes)
#   - lighthouse : audit perf/a11y/SEO sur build artefact (gates : perf ≥ 80, a11y ≥ 95)
#   (le contrôle de syntaxe Python est une étape du build)
#
# Les jobs e2e + lighthouse partagent le .next via artifact pour éviter
# de rebuild 3 fois (économie ~6 min wall-time).

# Auto-triggers actifs : gate sur les PRs et les pushes vers `main` et `test`
# (réactivés le 2026-07-23 après reset du quota Actions). `workflow_dispatch`
# reste disponible pour les lancements manuels.
#
# Minutes Actions (dépôt privé, 2 000 min/mois incluses) : le quota de
# septembre 2026 a été épuisé le 13, et tous les jobs ont cessé de démarrer.
# Depuis : un push qui ne touche ni le site ni les scripts ne lance rien,
# Lighthouse ne part qu'à la main, et le contrôle Python est une étape du build
# (GitHub arrondit chaque job à la minute : un job de 20 s coûtait 1 min).
on:
  pull_request:
    branches: [main, test]
  push:
    branches: [main, test]
    paths:
      - 'website/**'
      - 'pipeline/scripts/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
  # Appelé par enrich-pipeline.yml comme gate avant publication d'un refresh
  # data : mêmes checks, sur la branche data/refresh-*. Un push fait avec
  # GITHUB_TOKEN ne déclenche aucun workflow, donc sans cet appel explicite
  # la branche data ne serait jamais testée.
  workflow_call:
    inputs:
      ref:
        description: "Ref à tester (branche data/refresh-*)"
        type: string
        required: true
      run_e2e:
        description: "Forcer le golden path Playwright"
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (lint + typecheck + Vitest + next build)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      # Ancien job « Pipeline (Python syntax) », ici pour ne pas payer un runner
      # de plus : python3 est déjà sur l'image ubuntu-latest.
      - name: Pipeline (Python syntax)
        working-directory: .
        run: python3 -m compileall -q pipeline/scripts/

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # tsc dépasse le tas par défaut de Node (2 Go) depuis le 13 septembre 2026 :
        # « JavaScript heap out of memory », exit 134 (run 34726875711).
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # next build dépasse lui aussi le tas par défaut de Node (2 Go) :
          # « Reached heap limit », run 34794760769 du 2026-09-14. Vercel,
          # qui construit avec plus de mémoire, passe sur le même commit.
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Remove .next/cache (not needed downstream)
        run: rm -rf .next/cache

      # Tar .next before upload: Next.js emits chunk files containing `:`
      # (e.g. `[externals]_node:crypto_*.js`) which actions/upload-artifact
      # rejects. Wrapping in a tarball preserves filenames intact.
      - name: Package .next as tarball
        run: tar -cf next-build.tar .next

      - name: Upload .next artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: website/next-build.tar
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: E2E (Playwright golden path)
    needs: build
    # Ne tourne que sur push main (pas sur chaque PR) pour économiser les
    # minutes Actions sur repos privés. Si besoin de tester E2E sur une
    # PR spécifique, lancer manuellement via workflow_dispatch. Forcé quand
    # enrich-pipeline.yml nous appelle : c'est le test qui dit si le site
    # sert encore avec les nouveaux JSON.
    if: inputs.run_e2e || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download .next artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: website

      - name: Extract .next tarball
        run: tar -xf next-build.tar && rm next-build.tar

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('website/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start Next.js server
        run: npm run start &
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Wait for server
        run: npx --yes wait-on http://localhost:3000 -t 60000

      - name: Run Playwright
        run: PLAYWRIGHT_BASE_URL=http://localhost:3000 npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: website/playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse ${{ matrix.profile }}
    needs: build
    # Ne tourne que sur push main pour économiser les minutes Actions
    # (Lighthouse desktop + mobile = ~15-20 min cumulées). Pas critique
    # de l'avoir sur chaque PR : on peut lancer manuellement si on
    # touche à un truc perf-sensible. Pas non plus sur un refresh data
    # (inputs.ref) : les JSON ne changent pas la perf.
    # Lancement manuel seulement depuis le 2026-09-14 : desktop + mobile
    # coûtaient deux jobs à chaque push sur main.
    if: ${{ !inputs.ref && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, mobile]
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download .next artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: website

      - name: Extract .next tarball
        run: tar -xf next-build.tar && rm next-build.tar

      - name: Start Next.js server
        run: npm run start &
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Wait for server
        run: npx --yes wait-on http://localhost:3000 -t 60000

      - name: Run Lighthouse CI (${{ matrix.profile }})
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/methode
            http://localhost:3000/ville/paris/budget
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./website/.lighthouserc${{ matrix.profile == 'mobile' && '.mobile' || '' }}.json

