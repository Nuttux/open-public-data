name: Pipeline (sync + dbt + export + enrich)

# Refresh hebdomadaire des données, publié SEULEMENT s'il passe les gates.
#
# `main` est la branche de production Vercel : tout push y est déployé dans
# les minutes qui suivent. Un refresh n'y arrive donc jamais directement :
#
#   refresh    : run_all.sh --strict (sync → dbt run + dbt test → export) puis
#                audit qualité. Toute étape qui échoue arrête tout. Si des
#                JSON ont changé, ils sont poussés sur une branche
#                data/refresh-<date>-<run>. Sinon : « rien à publier », fin.
#   gate-site  : ci.yml sur cette branche — lint, typecheck, Vitest,
#                next build ET golden path Playwright avec les nouveaux JSON.
#                Le site doit construire et servir, pas seulement les données
#                être justes.
#   publish    : fast-forward de main sur la branche → Vercel déploie.
#                Si main a bougé entre-temps (ff impossible) → PR à la place.
#   on-failure : si un gate échoue après le push de branche → PR ouverte avec
#                le rapport, pour inspection. main reste intact.
#
# Déclenchement :
#   - Cron   : tous les lundis 6h UTC (les datasets Ville bougent au mieux
#              mensuellement ; < 7 j de latence suffit)
#   - Manuel : Actions → Run workflow (phases, tier1, publish)
#
# Prérequis : vars.ENABLE_BQ_CI=true + secrets WIF — voir
# docs/runbooks/enable-bq-ci.md. Sans BQ, le run échoue explicitement
# (« ::error:: ») plutôt que de finir vert sans rien publier.

on:
  workflow_dispatch:
    inputs:
      phases:
        description: "Phases (auto = sync,dbt,export si BQ activé, sinon sync)"
        type: choice
        options:
          - "auto"
          - "sync,dbt,export"
          - "sync"
          - "enrich"
          - "sync,dbt,export,enrich"
        default: "auto"
      tier1:
        description: "Activer l'enrich tier1 (LLM payant ≥80k€)"
        type: boolean
        default: false
      publish:
        description: "Publier sur main si les gates passent (sinon : branche + PR seulement)"
        type: boolean
        default: true

  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write
  id-token: write   # Workload Identity Federation (auth GCP)

# Un seul refresh à la fois ; on n'annule pas un run en cours (il tient peut-
# être une branche à moitié poussée).
concurrency:
  group: data-refresh
  cancel-in-progress: false

env:
  DATA_PATHS: website/public/data/ pipeline/seeds/

jobs:
  # ===========================================================================
  refresh:
    environment: pipeline
    name: Refresh (sync → dbt → export → audit)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      branch: ${{ steps.push.outputs.branch }}
      title: ${{ steps.push.outputs.title }}
      publish: ${{ steps.phases.outputs.publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install requests

      - name: Resolve phases
        id: phases
        env:
          REQUESTED: ${{ inputs.phases || 'auto' }}
          BQ_CI: ${{ vars.ENABLE_BQ_CI }}
          # Sur `schedule` il n'y a pas d'inputs : `inputs.publish` est vide,
          # donc faux. C'est ce qui a rendu l'ancien step « Commit & push »
          # inerte sur chaque cron. Le cron publie par défaut ; le manuel suit
          # sa case à cocher.
          PUBLISH_INPUT: ${{ github.event_name == 'schedule' && 'true' || inputs.publish }}
        run: |
          if [[ "$REQUESTED" == "auto" ]]; then
            if [[ "$BQ_CI" != "true" ]]; then
              # Toutes les sources passent par BigQuery : sans lui le refresh
              # ne peut rien faire. L'ancien cron résolvait en `sync` seul,
              # avalait l'échec du sync et finissait vert — quatre lundis de
              # « succès » sans qu'un octet n'atteigne le site (août 2026).
              # Un run rouge qui dit pourquoi vaut mieux qu'un vert qui ment.
              echo "::error::ENABLE_BQ_CI n'est pas à 'true' : le refresh auto ne peut ni construire ni publier." \
                   "Setup : docs/runbooks/enable-bq-ci.md (WIF + secrets + variable)."
              exit 1
            fi
            # Pas d'enrich en CI : run_enrichment.py dépense des crédits LLM,
            # l'enrichissement se fait en session (cf. run_all.sh --cron-safe).
            RESOLVED="sync,dbt,export"
          else
            RESOLVED="$REQUESTED"
          fi
          PUBLISH="$PUBLISH_INPUT"
          if [[ "$RESOLVED" != *"export"* ]]; then
            # Sans export, rien de nouveau dans website/public/data : il n'y
            # a rien à publier, et on le dit plutôt que de laisser croire
            # que le site s'est mis à jour.
            PUBLISH="false"
            echo "::warning::Phases = '$RESOLVED' (pas d'export) : rien ne sera publié sur le site." \
                 "Pour un refresh complet, ENABLE_BQ_CI=true est requis (docs/runbooks/enable-bq-ci.md)."
          fi
          echo "→ phases : $RESOLVED · publish : $PUBLISH"
          echo "resolved=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH"   >> "$GITHUB_OUTPUT"
          if [[ "$RESOLVED" == *"dbt"* || "$RESOLVED" == *"export"* ]]; then
            echo "needs_bq=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_bq=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to GCP (Workload Identity Federation)
        if: steps.phases.outputs.needs_bq == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install dbt
        if: contains(steps.phases.outputs.resolved, 'dbt')
        run: pip install dbt-core dbt-bigquery

      - name: Configure dbt profile
        if: contains(steps.phases.outputs.resolved, 'dbt')
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          paris_open_data:
            target: prod
            outputs:
              prod:
                type: bigquery
                method: oauth
                project: open-data-france-484717
                dataset: dbt_paris
                location: EU
                threads: 4
                timeout_seconds: 600
          EOF

      - name: Run pipeline (--strict)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY:    ${{ secrets.GOOGLE_API_KEY }}
          PYTHON: python
          # Force le profil prod (sinon pipeline/profiles.yml template DBT_USER → local)
          DBT_PROFILES_DIR: /home/runner/.dbt
          DBT_TARGET: prod
        run: |
          chmod +x pipeline/run_all.sh
          TIER1_FLAG=""
          if [[ "${{ inputs.tier1 }}" == "true" ]]; then TIER1_FLAG="--tier1"; fi
          # --strict : plus de « ⚠ … on continue ». Un sync raté, un seed
          # cassé, un test dbt rouge ou un export incomplet arrêtent le run
          # ici — avant qu'un JSON à moitié réécrit ne soit poussé.
          bash pipeline/run_all.sh --only="${{ steps.phases.outputs.resolved }}" --strict $TIER1_FLAG

      # L'audit écrit website/public/data/data_quality_audit.json (ce que
      # /methode#audit affiche) et sort non-zéro si un check est en `fail`.
      # Il est donc publié avec le refresh — et un `fail` bloque le refresh.
      - name: Data quality audit
        if: contains(steps.phases.outputs.resolved, 'dbt')
        run: |
          pip install google-cloud-bigquery db-dtypes
          python pipeline/scripts/audit/run_data_quality_audit.py

      - name: Detect changes
        id: detect
        run: |
          git add $DATA_PATHS
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Rien n'a changé dans $DATA_PATHS — rien à publier."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat | tail -n 30
          fi

      # Ce qui a changé, en clair : années disponibles par index, totaux par
      # année, état de l'audit. Sert de message de commit, de corps de PR et de
      # résumé du run — c'est ce qu'on lit le lundi pour savoir ce que le site
      # a reçu.
      - name: Summarize data diff
        if: steps.detect.outputs.changed == 'true'
        run: |
          python pipeline/scripts/audit/summarize_data_diff.py --base HEAD > /tmp/refresh-summary.md
          cat /tmp/refresh-summary.md >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/refresh-summary.md

      - name: Upload summary
        if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: refresh-summary
          path: /tmp/refresh-summary.md
          retention-days: 30

      - name: Push refresh branch
        id: push
        if: steps.detect.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="data/refresh-$(date -u +%Y%m%d)-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          TITLE="$(python pipeline/scripts/audit/summarize_data_diff.py --base HEAD --title)"
          { echo "$TITLE"; echo; cat /tmp/refresh-summary.md; } > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE"   >> "$GITHUB_OUTPUT"
          echo "→ branche poussée : $BRANCH"

  # ===========================================================================
  # Le site doit construire et servir avec les nouveaux JSON. Réutilise ci.yml
  # (lint + typecheck + Vitest + next build + Playwright) sur la branche data.
  gate-site:
    name: Gate — le site construit et sert
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.refresh.outputs.branch }}
      run_e2e: true

  # ===========================================================================
  publish:
    name: Publish (fast-forward main → Vercel)
    needs: [refresh, gate-site]
    if: needs.refresh.outputs.changed == 'true' && needs.refresh.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pr_url: ${{ steps.ff.outputs.pr_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download summary
        uses: actions/download-artifact@v4
        with:
          name: refresh-summary
          path: /tmp

      - name: Fast-forward main
        id: ff
        env:
          BRANCH: ${{ needs.refresh.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          # Fast-forward uniquement : le commit publié est exactement celui
          # que gate-site a testé. Si main a bougé entre-temps, on ne merge
          # pas à l'aveugle — on ouvre une PR et on laisse un humain regarder.
          if git merge --ff-only "origin/$BRANCH"; then
            git push origin main
            git push origin --delete "$BRANCH"
            echo "✓ publié sur main → Vercel déploie ($BRANCH supprimée)"
          else
            {
              echo "✅ Gates verts sur cette branche, mais **main a avancé pendant le refresh** : fast-forward impossible."
              echo "Merger à la main après relecture (le commit publié doit rester celui que gate-site a testé — préférer un rebase + re-run à un merge commit)."
              echo
              echo "---"
              cat /tmp/refresh-summary.md
            } > /tmp/pr-body.md
            PR_URL=$(gh pr create --base main --head "$BRANCH" \
              --title "$(git log -1 --format=%s "origin/$BRANCH")" \
              --body-file /tmp/pr-body.md)
            echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
            echo "::warning::main a bougé pendant le refresh — PR ouverte au lieu d'un push direct : $PR_URL"
          fi

  # ===========================================================================
  # Un gate a échoué APRÈS le push de branche : on garde la branche et on ouvre
  # une PR avec le rapport, pour que l'échec soit lisible (diff + logs) plutôt
  # que perdu dans un run rouge. Rien n'atteint main.
  on-failure:
    name: Gate rouge → PR d'inspection
    needs: [refresh, gate-site]
    if: always() && needs.refresh.outputs.branch != '' && needs.gate-site.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr_url: ${{ steps.pr.outputs.pr_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download summary
        uses: actions/download-artifact@v4
        with:
          name: refresh-summary
          path: /tmp

      - name: Open inspection PR
        id: pr
        env:
          BRANCH: ${{ needs.refresh.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "🔴 **Le site ne construit pas ou ne sert pas avec ces données** — voir le run : $RUN_URL"
            echo
            echo "Rien n'a été publié. Corriger, puis relancer le workflow ; cette branche peut être supprimée."
            echo
            echo "---"
            cat /tmp/refresh-summary.md
          } > /tmp/pr-body.md
          PR_URL=$(gh pr create --draft --base main --head "$BRANCH" \
            --title "🔴 data refresh bloqué par gate-site — $BRANCH" \
            --body-file /tmp/pr-body.md)
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "→ PR d'inspection : $PR_URL"

  # ===========================================================================
  # Le mail du lundi. Toujours envoyé (vert, gris, rouge) : un lundi sans mail
  # doit vouloir dire « le workflow n'a pas tourné », jamais « il n'y avait rien
  # à dire ». Passe par Resend, déjà utilisé par le formulaire de signalement.
  # Sans RESEND_API_KEY : avertissement visible, le run n'échoue pas pour ça.
  notify:
    environment: pipeline
    name: Mail du lundi
    needs: [refresh, gate-site, publish, on-failure]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download summary
        if: needs.refresh.outputs.changed == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: refresh-summary
          path: /tmp

      - name: Compose & send
        env:
          REFRESH_RESULT: ${{ needs.refresh.result }}
          GATE_RESULT:    ${{ needs.gate-site.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          CHANGED:        ${{ needs.refresh.outputs.changed }}
          PUBLISH_WANTED: ${{ needs.refresh.outputs.publish }}
          TITLE:          ${{ needs.refresh.outputs.title }}
          BRANCH:         ${{ needs.refresh.outputs.branch }}
          PR_URL:         ${{ needs.publish.outputs.pr_url || needs.on-failure.outputs.pr_url }}
          RUN_URL:        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUMMARY_PATH:   /tmp/refresh-summary.md
          MAIL_TO:        ${{ vars.REFRESH_EMAIL_TO || 'daniel@qipu.org' }}
          MAIL_FROM:      ${{ vars.REFRESH_EMAIL_FROM || 'Qipu refresh <onboarding@resend.dev>' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python pipeline/scripts/audit/compose_refresh_email.py > /tmp/mail.json
          python -c "import json;d=json.load(open('/tmp/mail.json'));print('→', d['subject']);print(d['text'][:600])"
          if [[ -z "$RESEND_API_KEY" ]]; then
            echo "::warning::RESEND_API_KEY absent : mail non envoyé. gh secret set RESEND_API_KEY -R ${{ github.repository }}"
            exit 0
          fi
          code=$(curl -s -o /tmp/resend.out -w '%{http_code}' -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" \
            --data @/tmp/mail.json)
          cat /tmp/resend.out; echo
          if [[ "$code" != "200" ]]; then
            echo "::warning::Resend a répondu $code — mail non envoyé (voir ci-dessus)."
          else
            echo "✓ mail envoyé à $MAIL_TO"
          fi